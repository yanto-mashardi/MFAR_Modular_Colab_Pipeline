<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31566f"/></marker>
    <style>
      .title{font:700 34px Arial;fill:#0b3558}.sub{font:18px Arial;fill:#416275}
      .head{font:700 19px Arial;fill:#ffffff}.body{font:16px Arial;fill:#17384d}.small{font:14px Arial;fill:#456274}
      .box{rx:15;stroke-width:2}.arrow{stroke:#31566f;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .audit{font:700 15px Arial;fill:#7b2d13}.pass{font:700 15px Arial;fill:#17633a}
    </style>
  </defs>
  <rect width="1500" height="1180" fill="#f4f8fb"/>
  <text x="750" y="50" text-anchor="middle" class="title">MFAR Pipeline — Revised Auditable Structure</text>
  <text x="750" y="82" text-anchor="middle" class="sub">AIS Jan–Mar 2026 · calibration Jan–Feb · temporal holdout March · scenario evaluation</text>

  <g transform="translate(70,125)">
    <rect width="270" height="125" class="box" fill="#e5f1fb" stroke="#0b5fa5"/>
    <rect width="270" height="38" rx="13" fill="#0b5fa5"/><text x="135" y="26" text-anchor="middle" class="head">01 · AIS cleaning</text>
    <text x="18" y="66" class="body">32,358 raw → 32,245 clean</text><text x="18" y="91" class="small">Corridor, SOG, duplicates</text><text x="18" y="113" class="pass">Map audit: unique IDs + layers</text>
  </g>
  <path d="M340 188 L395 188" class="arrow"/>
  <g transform="translate(400,125)">
    <rect width="290" height="125" class="box" fill="#e8f6f3" stroke="#00897b"/>
    <rect width="290" height="38" rx="13" fill="#00897b"/><text x="145" y="26" text-anchor="middle" class="head">02 · State grid</text>
    <text x="18" y="66" class="body">40,328 five-minute points</text><text x="18" y="91" class="small">MMSI × date × voyage/gap/jump</text><text x="18" y="113" class="pass">Full + vessel-day maps</text>
  </g>
  <path d="M690 188 L745 188" class="arrow"/>
  <g transform="translate(750,125)">
    <rect width="300" height="125" class="box" fill="#f2ecfa" stroke="#7046a1"/>
    <rect width="300" height="38" rx="13" fill="#7046a1"/><text x="150" y="26" text-anchor="middle" class="head">03 · Berth calibration</text>
    <text x="18" y="66" class="body">Observed berth episodes</text><text x="18" y="91" class="small">Vessel-specific turnaround + reliability</text><text x="18" y="113" class="pass">Past episodes only</text>
  </g>
  <path d="M1050 188 L1105 188" class="arrow"/>
  <g transform="translate(1110,125)">
    <rect width="320" height="125" class="box" fill="#fff3df" stroke="#d97706"/>
    <rect width="320" height="38" rx="13" fill="#d97706"/><text x="160" y="26" text-anchor="middle" class="head">Temporal partition</text>
    <text x="18" y="66" class="body">Calibration: Jan–Feb</text><text x="18" y="91" class="body">Holdout: March (31 days)</text><text x="18" y="113" class="pass">No future-data leakage</text>
  </g>

  <path d="M1270 250 L1270 315 L1130 315" class="arrow"/>
  <g transform="translate(850,330)">
    <rect width="580" height="160" class="box" fill="#eaf4fc" stroke="#1769aa"/>
    <rect width="580" height="40" rx="13" fill="#1769aa"/><text x="290" y="27" text-anchor="middle" class="head">04 · Pre-departure forecast on holdout</text>
    <text x="22" y="70" class="body">Decision time = detected departure − 15 minutes</text>
    <text x="22" y="98" class="body">Queue, ETA, berth availability, service gap, capacity shortfall</text>
    <text x="22" y="126" class="small">Known demand profile + historical estimates before decision time</text>
    <text x="22" y="151" class="pass">ETA compared with observed destination berth arrival</text>
  </g>
  <path d="M850 410 L785 410" class="arrow"/>
  <g transform="translate(470,330)">
    <rect width="310" height="160" class="box" fill="#f1f8e9" stroke="#558b2f"/>
    <rect width="310" height="40" rx="13" fill="#558b2f"/><text x="155" y="27" text-anchor="middle" class="head">05 · Fuzzification</text>
    <text x="18" y="74" class="body">membership_parameters.csv</text><text x="18" y="102" class="small">22 configured memberships</text><text x="18" y="130" class="small">No notebook constants</text><text x="18" y="153" class="pass">Range audit 0 ≤ μ ≤ 1</text>
  </g>
  <path d="M470 410 L405 410" class="arrow"/>
  <g transform="translate(70,330)">
    <rect width="330" height="160" class="box" fill="#fff0f1" stroke="#b33a3a"/>
    <rect width="330" height="40" rx="13" fill="#b33a3a"/><text x="165" y="27" text-anchor="middle" class="head">06 · Rule evaluation</text>
    <text x="18" y="74" class="body">fuzzy_rules.csv</text><text x="18" y="102" class="body">action_constraints.csv</text><text x="18" y="130" class="small">Phase feasibility + priority</text><text x="18" y="153" class="pass">No causal action conflict</text>
  </g>

  <path d="M235 490 L235 555" class="arrow"/>
  <g transform="translate(70,570)">
    <rect width="1360" height="190" class="box" fill="#fff8e6" stroke="#b7791f"/>
    <rect width="1360" height="42" rx="13" fill="#b7791f"/><text x="680" y="29" text-anchor="middle" class="head">07 · Multi-day scenario evaluation (not empirical intervention validation)</text>
    <text x="30" y="82" class="body">Baseline and configured actions use the same exogenous arrival profile and observed AIS service schedule.</text>
    <text x="30" y="114" class="body">DEPART_NOW / HOLD shift an existing service; ADD_VESSEL creates a configured extra service; non-queue actions retain zero queue effect.</text>
    <text x="30" y="146" class="body">Reported by day and port: queue area, critical duration, improved/worsened days, accepted operational recommendations.</text>
    <text x="30" y="176" class="audit">Interpretation boundary: scenario effect supports sensitivity analysis; it is not observed causal impact.</text>
  </g>

  <g transform="translate(70,815)">
    <rect width="420" height="270" class="box" fill="#ffffff" stroke="#5b7180"/>
    <text x="210" y="36" text-anchor="middle" class="body" font-weight="700">Machine-readable contracts</text>
    <text x="24" y="76" class="small">CSV · full stage tables</text><text x="24" y="108" class="small">JSON · execution and map audits</text><text x="24" y="140" class="small">Configuration snapshots used</text><text x="24" y="172" class="small">Temporal holdout validation table</text><text x="24" y="204" class="small">Daily scenario distributions</text><text x="24" y="240" class="pass">Reproducible downstream inputs</text>
  </g>
  <g transform="translate(540,815)">
    <rect width="420" height="270" class="box" fill="#ffffff" stroke="#5b7180"/>
    <text x="210" y="36" text-anchor="middle" class="body" font-weight="700">Researcher-readable outputs</text>
    <text x="24" y="76" class="small">Folium spatial validation maps</text><text x="24" y="108" class="small">Plotly timelines and dashboards</text><text x="24" y="140" class="small">Sankey rule → action flow</text><text x="24" y="172" class="small">Membership curves and explorer</text><text x="24" y="204" class="small">Excel summaries per stage</text><text x="24" y="240" class="pass">Hover, zoom, filter, direct reading</text>
  </g>
  <g transform="translate(1010,815)">
    <rect width="420" height="270" class="box" fill="#ffffff" stroke="#5b7180"/>
    <text x="210" y="36" text-anchor="middle" class="body" font-weight="700">Acceptance gates</text>
    <text x="24" y="76" class="small">Unique map object IDs</text><text x="24" y="108" class="small">Point/segment/layer counts</text><text x="24" y="140" class="small">No future information</text><text x="24" y="172" class="small">Rule/config schema alignment</text><text x="24" y="204" class="small">Phase-feasible actions</text><text x="24" y="240" class="pass">Pipeline stops on audit failure</text>
  </g>
</svg>
