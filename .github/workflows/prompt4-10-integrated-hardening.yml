name: Prompt 4-10 integrated hardening

on:
  push:
    branches:
      - method/prompt4-10-integrated-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt4-10-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FOLDER_NAME: In_Out_MFAR_Modular_Colab_Pipeline
  AIS_FILE_ID: 1anvGtFRU30yeNr3fTuId2XA690oGFGaA
  ARRIVAL_FILE_ID: 1F6J240iN2eQyRJiTAtvKL5mh7YMvVSnk

jobs:
  verify-prompts-4-to-10:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-baseline.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt

      - name: Enforce upstream scope boundary
        run: |
          changed="$(git diff --name-only origin/method/prompt3-prospective-decision-epoch...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/mfar_stage12.py|src/mfar_state_episode.py|src/mfar_prompt2_runtime.py|src/mfar_prospective_forecast.py|src/mfar_prompt3_runtime.py|notebooks/01_|notebooks/02_|notebooks/03_)'; then
            echo 'Prompts 4-10 must not change Stage 01-03 or Prompt 3 case generation.' >&2
            exit 1
          fi

      - name: Compile and run unit tests
        run: |
          python -m py_compile \
            src/mfar_prompt4_7.py \
            src/mfar_prompt5_6.py \
            src/mfar_prompt8_10.py \
            tools/verify_prompt4_10.py
          python -W error::FutureWarning -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download immutable raw inputs
        run: |
          mkdir -p "/tmp/prompt4_10/${DRIVE_FOLDER_NAME}/data_raw"
          python - <<'PY'
          import os
          from pathlib import Path
          import gdown
          root = Path('/tmp/prompt4_10') / os.environ['DRIVE_FOLDER_NAME'] / 'data_raw'
          for file_id, name in [
              (os.environ['AIS_FILE_ID'], 'ais_raw.csv'),
              (os.environ['ARRIVAL_FILE_ID'], 'vehicle_arrival_rate_30min.csv'),
          ]:
              path = root / name
              result = gdown.download(id=file_id, output=str(path), quiet=False)
              if result is None or not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'Google Drive input could not be downloaded: {file_id}')
          PY

      - name: Execute Stage 01-07 independently
        env:
          MFAR_CODE_ROOT: ${{ github.workspace }}
          MFAR_GDRIVE_ROOT: /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$MFAR_GDRIVE_ROOT/executed_notebooks"
          NOTEBOOKS=(
            01_AIS_Input_and_Cleaning.ipynb
            02_Time_Grid_and_State_Preparation.ipynb
            03_Monitoring_State.ipynb
            04_No_Intervention_Forecast.ipynb
            05_Fuzzification.ipynb
            06_Rule_Evaluation.ipynb
            07_Candidate_Action.ipynb
          )
          for notebook in "${NOTEBOOKS[@]}"; do
            echo "Executing ${notebook}"
            jupyter nbconvert --to notebook --execute \
              "notebooks/${notebook}" \
              --output "${notebook}" \
              --output-dir "$MFAR_GDRIVE_ROOT/executed_notebooks" \
              --ExecutePreprocessor.timeout=-1 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Verify Prompt 4-10 contracts
        env:
          MFAR_GDRIVE_ROOT: /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline
        run: |
          python tools/verify_prompt4_10.py \
            --drive-root "$MFAR_GDRIVE_ROOT" \
            --validation-root validation \
            --json /tmp/prompt4_10_report.json
          for prompt in 4 5 6 7 8 9 10; do
            file="validation/prompt${prompt}/PROMPT_${prompt}_ACCEPTANCE.md"
            {
              echo
              echo "## Workflow evidence"
              echo
              echo "- Workflow run: ${GITHUB_RUN_ID}"
              echo "- Source commit: ${GITHUB_SHA}"
              echo "- Branch: ${GITHUB_REF_NAME}"
              echo "- Unit tests and complete Stage 01-07 execution: PASS"
            } >> "$file"
          done

      - name: Commit acceptance records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/prompt4 validation/prompt5 validation/prompt6 validation/prompt7 validation/prompt8 validation/prompt9 validation/prompt10
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Record verified Prompt 4-10 acceptance"
            git push origin HEAD:method/prompt4-10-integrated-hardening
          fi

      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt4-10-integrated-hardening
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/prompt4_10_report.json
            validation/prompt4/PROMPT_4_ACCEPTANCE.md
            validation/prompt5/PROMPT_5_ACCEPTANCE.md
            validation/prompt6/PROMPT_6_ACCEPTANCE.md
            validation/prompt7/PROMPT_7_ACCEPTANCE.md
            validation/prompt8/PROMPT_8_ACCEPTANCE.md
            validation/prompt9/PROMPT_9_ACCEPTANCE.md
            validation/prompt10/PROMPT_10_ACCEPTANCE.md
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_04/04_forecast_quality_components.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_04/04_quality_error_calibration.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_04/04_berth_availability_audit.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_04/04_eta_benchmark_summary.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_05/05_membership_domain_coverage.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_05/05_membership_boundary_tests.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_06/06_rule_evaluation.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_06/06_rule_coverage_audit.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_06/06_monotonic_queue_boundary_test.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_07/07_scenario_baseline_vs_actions.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_07/07_sensitivity_scenarios.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_07/07_integrated_audit.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_07/07_claim_governance.csv
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_07/07_release_manifest.json
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/04_No_Intervention_Forecast.ipynb
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/05_Fuzzification.ipynb
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/06_Rule_Evaluation.ipynb
            /tmp/prompt4_10/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/07_Candidate_Action.ipynb
