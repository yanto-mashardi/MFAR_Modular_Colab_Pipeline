name: Prompt 2 state and berth episodes

on:
  push:
    branches:
      - method/prompt2-state-berth-episodes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt2-state-episodes-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_FOLDER_NAME: In_Out_MFAR_Modular_Colab_Pipeline
  AIS_FILE_ID: 1anvGtFRU30yeNr3fTuId2XA690oGFGaA
  ARRIVAL_FILE_ID: 1F6J240iN2eQyRJiTAtvKL5mh7YMvVSnk

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Prompt 2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-baseline.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt

      - name: Enforce Prompt 2 scope boundary
        run: |
          changed="$(git diff --name-only origin/refactor/prompt1-stage01-02...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/mfar_stage12.py|notebooks/01_|notebooks/02_)'; then
            echo 'Prompt 2 must not modify Stage 01-02 implementation.' >&2
            exit 1
          fi

      - name: Compile and run unit tests
        run: |
          python -m py_compile src/mfar_state_episode.py tools/verify_prompt2_state_episode.py
          python -W error::FutureWarning -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download immutable raw inputs
        run: |
          mkdir -p "/tmp/prompt2/${DRIVE_FOLDER_NAME}/data_raw"
          python - <<'PY'
          import os
          from pathlib import Path
          import gdown

          root = Path('/tmp/prompt2') / os.environ['DRIVE_FOLDER_NAME'] / 'data_raw'
          targets = {
              os.environ['AIS_FILE_ID']: root / 'ais_raw.csv',
              os.environ['ARRIVAL_FILE_ID']: root / 'vehicle_arrival_rate_30min.csv',
          }
          for file_id, path in targets.items():
              result = gdown.download(id=file_id, output=str(path), quiet=False)
              if result is None or not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'Google Drive input could not be downloaded: {file_id}')
          PY

      - name: Execute Stage 01-07 independently
        env:
          MFAR_CODE_ROOT: ${{ github.workspace }}
          MFAR_GDRIVE_ROOT: /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$MFAR_GDRIVE_ROOT/executed_notebooks"
          NOTEBOOKS=(
            01_AIS_Input_and_Cleaning.ipynb
            02_Time_Grid_and_State_Preparation.ipynb
            03_Monitoring_State.ipynb
            04_No_Intervention_Forecast.ipynb
            05_Fuzzification.ipynb
            06_Rule_Evaluation.ipynb
            07_Candidate_Action.ipynb
          )
          for notebook in "${NOTEBOOKS[@]}"; do
            echo "Executing ${notebook}"
            jupyter nbconvert --to notebook --execute \
              "notebooks/${notebook}" \
              --output "${notebook}" \
              --output-dir "$MFAR_GDRIVE_ROOT/executed_notebooks" \
              --ExecutePreprocessor.timeout=-1 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Verify Prompt 2 methodological contracts
        env:
          MFAR_GDRIVE_ROOT: /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline
        run: |
          python tools/verify_prompt2_state_episode.py \
            --drive-root "$MFAR_GDRIVE_ROOT" \
            --output /tmp/prompt2_state_episode_report.json \
            --markdown validation/prompt2/PROMPT_2_ACCEPTANCE.md
          {
            echo
            echo "## Workflow evidence"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Unit tests and complete Stage 01-07 execution: PASS"
          } >> validation/prompt2/PROMPT_2_ACCEPTANCE.md

      - name: Commit verified acceptance record
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/prompt2/PROMPT_2_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Record verified Prompt 2 state reconstruction"
            git push origin HEAD:method/prompt2-state-berth-episodes
          fi

      - name: Upload Prompt 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt2-state-berth-episodes
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/prompt2_state_episode_report.json
            validation/prompt2/PROMPT_2_ACCEPTANCE.md
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_03/03_berth_episode_history.csv
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_03/03_service_call_history.csv
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_03/03_berth_episode_class_summary.csv
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_03/03_state_transition_summary.csv
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_03/03_berth_prediction_audit.csv
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/03_Monitoring_State.ipynb
            /tmp/prompt2/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/04_No_Intervention_Forecast.ipynb
