name: Prompt 1 Stage 01-02 behavior-preserving refactor

on:
  push:
    branches:
      - refactor/prompt1-stage01-02
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt1-stage12-${{ github.ref }}
  cancel-in-progress: false

env:
  DRIVE_FOLDER_NAME: In_Out_MFAR_Modular_Colab_Pipeline
  AIS_FILE_ID: 1anvGtFRU30yeNr3fTuId2XA690oGFGaA
  ARRIVAL_FILE_ID: 1F6J240iN2eQyRJiTAtvKL5mh7YMvVSnk

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Prompt 1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-baseline.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt

      - name: Materialize reviewed Prompt 1 payload
        run: |
          if [[ ! -f tools/bootstrap_prompt1_payload.py ]]; then
            cat tools/prompt1_payload/part-* > tools/bootstrap_prompt1_payload.py
          fi
          python tools/bootstrap_prompt1_payload.py

      - name: Apply maintenance-only compatibility fixes
        run: |
          python tools/apply_behavior_preserving_maintenance.py
          python tools/apply_behavior_preserving_maintenance.py --check
          git diff --check

      - name: Compile and run unit tests
        run: |
          python -m py_compile src/mfar_stage12.py tools/*.py
          python -W error::FutureWarning -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download immutable raw inputs
        run: |
          mkdir -p "/tmp/prompt1/${DRIVE_FOLDER_NAME}/data_raw"
          python - <<'PY'
          import os
          from pathlib import Path
          import gdown

          root = Path('/tmp/prompt1') / os.environ['DRIVE_FOLDER_NAME'] / 'data_raw'
          targets = {
              os.environ['AIS_FILE_ID']: root / 'ais_raw.csv',
              os.environ['ARRIVAL_FILE_ID']: root / 'vehicle_arrival_rate_30min.csv',
          }
          for file_id, path in targets.items():
              result = gdown.download(id=file_id, output=str(path), quiet=False)
              if result is None or not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'Google Drive input could not be downloaded: {file_id}')
          PY

      - name: Execute Stage 01-07 in separate notebooks
        env:
          MFAR_CODE_ROOT: ${{ github.workspace }}
          MFAR_GDRIVE_ROOT: /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$MFAR_GDRIVE_ROOT/executed_notebooks"
          NOTEBOOKS=(
            01_AIS_Input_and_Cleaning.ipynb
            02_Time_Grid_and_State_Preparation.ipynb
            03_Monitoring_State.ipynb
            04_No_Intervention_Forecast.ipynb
            05_Fuzzification.ipynb
            06_Rule_Evaluation.ipynb
            07_Candidate_Action.ipynb
          )
          for notebook in "${NOTEBOOKS[@]}"; do
            echo "Executing ${notebook}"
            jupyter nbconvert --to notebook --execute \
              "notebooks/${notebook}" \
              --output "${notebook}" \
              --output-dir "$MFAR_GDRIVE_ROOT/executed_notebooks" \
              --ExecutePreprocessor.timeout=-1 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Diagnose Stage 02 against legacy controller
        env:
          MFAR_CODE_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          CURRENT_ROOT: /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline
          LEGACY_ROOT: /tmp/prompt1_legacy/In_Out_MFAR_Modular_Colab_Pipeline
        run: |
          set -euo pipefail
          mkdir -p "$LEGACY_ROOT/data_raw" "$LEGACY_ROOT/stage_output/stage_01" "$LEGACY_ROOT/executed_notebooks" /tmp/prompt1_legacy/notebooks
          cp "$CURRENT_ROOT/data_raw/"*.csv "$LEGACY_ROOT/data_raw/"
          cp "$CURRENT_ROOT/stage_output/stage_01/01_ais_clean.csv" "$LEGACY_ROOT/stage_output/stage_01/"
          git show bcf3afe36e3edf9ca84047933316878ffa4b606a:notebooks/02_Time_Grid_and_State_Preparation.ipynb \
            > /tmp/prompt1_legacy/notebooks/02_Time_Grid_and_State_Preparation.ipynb
          MFAR_GDRIVE_ROOT="$LEGACY_ROOT" jupyter nbconvert --to notebook --execute \
            /tmp/prompt1_legacy/notebooks/02_Time_Grid_and_State_Preparation.ipynb \
            --output 02_Time_Grid_and_State_Preparation.ipynb \
            --output-dir "$LEGACY_ROOT/executed_notebooks" \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.kernel_name=python3
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np
          import pandas as pd

          current_path = Path(os.environ['CURRENT_ROOT']) / 'stage_output/stage_02/02_vessel_interpolated_grid.csv'
          legacy_path = Path(os.environ['LEGACY_ROOT']) / 'stage_output/stage_02/02_vessel_interpolated_grid.csv'

          current = pd.read_csv(current_path, low_memory=False)
          legacy = pd.read_csv(legacy_path, low_memory=False)
          report = {
              'current_sha256': hashlib.sha256(current_path.read_bytes()).hexdigest(),
              'legacy_sha256': hashlib.sha256(legacy_path.read_bytes()).hexdigest(),
              'shape_current': list(current.shape),
              'shape_legacy': list(legacy.shape),
              'columns_equal': list(current.columns) == list(legacy.columns),
              'column_differences': [],
              'raw_string_differences': [],
          }

          if list(current.columns) == list(legacy.columns) and current.shape == legacy.shape:
              for column in current.columns:
                  left = legacy[column]
                  right = current[column]
                  if pd.api.types.is_numeric_dtype(left) and pd.api.types.is_numeric_dtype(right):
                      a = left.to_numpy(dtype=float, na_value=np.nan)
                      b = right.to_numpy(dtype=float, na_value=np.nan)
                      equal = (a == b) | (np.isnan(a) & np.isnan(b))
                      count = int((~equal).sum())
                      if count:
                          finite = np.isfinite(a) & np.isfinite(b)
                          max_abs = float(np.max(np.abs(a[finite] - b[finite]))) if finite.any() else None
                          indices = np.flatnonzero(~equal)[:5].tolist()
                          report['column_differences'].append({
                              'column': column, 'count': count, 'max_abs_difference': max_abs,
                              'samples': [
                                  {'row': int(i), 'legacy': None if pd.isna(left.iloc[i]) else left.iloc[i],
                                   'current': None if pd.isna(right.iloc[i]) else right.iloc[i]}
                                  for i in indices
                              ],
                          })
                  else:
                      a = left.astype('string').fillna('<NA>')
                      b = right.astype('string').fillna('<NA>')
                      unequal = a.ne(b)
                      count = int(unequal.sum())
                      if count:
                          indices = np.flatnonzero(unequal.to_numpy())[:5].tolist()
                          report['column_differences'].append({
                              'column': column, 'count': count,
                              'samples': [
                                  {'row': int(i), 'legacy': str(a.iloc[i]), 'current': str(b.iloc[i])}
                                  for i in indices
                              ],
                          })

              with legacy_path.open(newline='', encoding='utf-8') as lf, current_path.open(newline='', encoding='utf-8') as cf:
                  legacy_rows = csv.reader(lf)
                  current_rows = csv.reader(cf)
                  header_l = next(legacy_rows)
                  header_c = next(current_rows)
                  for row_number, (row_l, row_c) in enumerate(zip(legacy_rows, current_rows), start=2):
                      if row_l != row_c:
                          diffs = []
                          for idx, (lv, cv) in enumerate(zip(row_l, row_c)):
                              if lv != cv:
                                  diffs.append({'column': header_l[idx], 'legacy': lv, 'current': cv})
                              if len(diffs) >= 8:
                                  break
                          report['raw_string_differences'].append({'row': row_number, 'differences': diffs})
                          if len(report['raw_string_differences']) >= 8:
                              break

          out = Path('/tmp/stage2_legacy_diagnostic.json')
          out.write_text(json.dumps(report, indent=2, default=str), encoding='utf-8')
          print(out)
          print(json.dumps(report, indent=2, default=str))
          PY

      - name: Verify exact baseline equivalence
        env:
          MFAR_GDRIVE_ROOT: /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline
        run: |
          set +e
          python tools/verify_prompt1_equivalence.py \
            --baseline validation/baseline/baseline_manifest.json \
            --drive-root "$MFAR_GDRIVE_ROOT" \
            --output /tmp/prompt1_equivalence_report.json \
            --markdown validation/prompt1/PROMPT_1_ACCEPTANCE.md
          status=$?
          set -e
          cat /tmp/prompt1_equivalence_report.json
          if [[ "$status" -ne 0 ]]; then
            cat validation/prompt1/PROMPT_1_ACCEPTANCE.md
            exit "$status"
          fi
          {
            echo
            echo "## Workflow evidence"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Unit tests and complete Stage 01–07 execution: PASS"
            echo "- Notebook cell-ID check: PASS"
            echo "- Deprecated openpyxl style-copy check: PASS"
          } >> validation/prompt1/PROMPT_1_ACCEPTANCE.md

      - name: Commit verified maintenance artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch tools/prompt1_payload
          git add src/mfar_stage12.py src/mfar_visuals.py notebooks/*.ipynb tests/test_stage12_refactor.py \
            tools/bootstrap_prompt1_payload.py tools/apply_behavior_preserving_maintenance.py \
            tools/verify_prompt1_equivalence.py docs/PROMPT_1_REFACTOR.md \
            validation/prompt1/PROMPT_1_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Record verified Prompt 1 maintenance outputs"
            git push origin HEAD:refactor/prompt1-stage01-02
          fi

      - name: Upload Prompt 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt1-stage12-equivalence
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/prompt1_equivalence_report.json
            /tmp/stage2_legacy_diagnostic.json
            validation/prompt1/PROMPT_1_ACCEPTANCE.md
            /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_02/02_vessel_interpolated_grid.csv
            /tmp/prompt1_legacy/In_Out_MFAR_Modular_Colab_Pipeline/stage_output/stage_02/02_vessel_interpolated_grid.csv
            /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/01_AIS_Input_and_Cleaning.ipynb
            /tmp/prompt1/In_Out_MFAR_Modular_Colab_Pipeline/executed_notebooks/02_Time_Grid_and_State_Preparation.ipynb
